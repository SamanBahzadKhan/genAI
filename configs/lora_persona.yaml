model_name: HuggingFaceTB/SmolLM2-360M-Instruct
dataset_path: data/persona_lora/ramsay_style_preferences.json
output_dir: outputs/lora_persona
beta: 0.1
max_length: 512
max_prompt_length: 256
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
per_device_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
num_epochs: 3
seed: 42
fp16: true
gradient_checkpointing: true
logging_steps: 5
